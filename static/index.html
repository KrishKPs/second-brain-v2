<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Second Brain</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0f0f0f;
  --card:         #1a1a1a;
  --card-hover:   #202020;
  --border:       rgba(255,255,255,0.07);
  --border-focus: rgba(59,130,246,0.6);
  --accent:       #3b82f6;
  --accent-dim:   rgba(59,130,246,0.12);
  --text:         #ffffff;
  --muted:        #666;
  --muted2:       #999;
  --green:        #22c55e;
  --yellow:       #eab308;
  --red:          #ef4444;
}

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ── LANDING ───────────────────────────────────────────────── */
#landing {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px 80px;
  gap: 0;
}

.landing-logo {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 28px;
}

.hero-title {
  font-size: clamp(48px, 8vw, 80px);
  font-weight: 800;
  letter-spacing: -3px;
  line-height: 1;
  background: linear-gradient(135deg, #fff 30%, #444 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 14px;
  text-align: center;
}

.hero-sub {
  font-size: 17px;
  color: var(--muted2);
  margin-bottom: 40px;
  text-align: center;
}

.search-hero {
  width: 100%;
  max-width: 580px;
  position: relative;
  margin-bottom: 24px;
}

.search-hero input {
  width: 100%;
  padding: 18px 24px 18px 54px;
  font-size: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  caret-color: var(--accent);
}

.search-hero input::placeholder { color: var(--muted); }

.search-hero input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-dim), 0 8px 32px rgba(0,0,0,0.4);
}

.search-hero .icon {
  position: absolute;
  left: 18px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
}

.chip {
  padding: 8px 15px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--muted2);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.18s;
  white-space: nowrap;
}

.chip:hover {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── APP SHELL (results state) ─────────────────────────────── */
#app { display: none; flex-direction: column; min-height: 100vh; }

#app-header {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 14px 28px;
  background: rgba(15,15,15,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.header-logo {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.3px;
  white-space: nowrap;
  flex-shrink: 0;
  cursor: pointer;
}

.header-logo em { font-style: normal; color: var(--accent); }

.search-header {
  flex: 1;
  max-width: 600px;
  position: relative;
}

.search-header input {
  width: 100%;
  padding: 11px 18px 11px 44px;
  font-size: 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  caret-color: var(--accent);
}

.search-header input::placeholder { color: var(--muted); }

.search-header input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-dim);
}

.search-header .icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

/* ── RESULTS ───────────────────────────────────────────────── */
#results-area {
  flex: 1;
  padding: 32px 28px 48px;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

.results-meta {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 20px;
  height: 18px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
  gap: 14px;
}

/* ── SKELETON ──────────────────────────────────────────────── */
@keyframes shimmer {
  0%   { background-position: -600px 0; }
  100% { background-position:  600px 0; }
}

.sk {
  background: linear-gradient(90deg, #1a1a1a 25%, #232323 50%, #1a1a1a 75%);
  background-size: 600px 100%;
  animation: shimmer 1.3s infinite linear;
  border-radius: 6px;
}

.skeleton-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.sk-img { height: 175px; }
.sk-body { padding: 13px 14px 16px; display: flex; flex-direction: column; gap: 9px; }
.sk-line { height: 11px; border-radius: 5px; }
.sk-line.w60 { width: 60%; }
.sk-line.w85 { width: 85%; }
.sk-line.w45 { width: 45%; }

/* ── CARD ──────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  position: relative;
  transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-4px);
  border-color: rgba(59,130,246,0.35);
  box-shadow: 0 16px 48px rgba(0,0,0,0.55), 0 0 0 1px rgba(59,130,246,0.2);
}

.card-img-wrap {
  position: relative;
  flex-shrink: 0;
  height: 175px;
  background: #111;
  overflow: hidden;
}

.card-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
  display: block;
  transition: transform 0.3s;
}

.card:hover .card-thumb { transform: scale(1.03); }

.card-no-thumb {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
}

.badge {
  position: absolute;
  top: 9px;
  right: 9px;
  padding: 3px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2px;
  backdrop-filter: blur(8px);
}

.badge-green  { background: rgba(34,197,94,0.18);  color: var(--green);  border: 1px solid rgba(34,197,94,0.35); }
.badge-yellow { background: rgba(234,179,8,0.18);  color: var(--yellow); border: 1px solid rgba(234,179,8,0.35); }
.badge-red    { background: rgba(239,68,68,0.18);  color: var(--red);    border: 1px solid rgba(239,68,68,0.35); }

.card-body {
  padding: 12px 14px 15px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.card-filename {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-preview {
  font-size: 12px;
  color: var(--muted2);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ── NO RESULTS ────────────────────────────────────────────── */
.no-results {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 0;
}

.no-results h3 { font-size: 20px; margin-bottom: 8px; }
.no-results p  { color: var(--muted2); font-size: 14px; }

/* ── LIGHTBOX ──────────────────────────────────────────────── */
#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(0,0,0,0.93);
  align-items: center;
  justify-content: center;
  padding: 40px;
  animation: fade-in 0.15s ease;
}

#lightbox.open { display: flex; }

@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

#lightbox-img {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  border-radius: 10px;
  box-shadow: 0 0 100px rgba(0,0,0,0.9);
}

#lb-close {
  position: fixed;
  top: 18px;
  right: 22px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.1);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s;
}

#lb-close:hover { background: rgba(255,255,255,0.15); }

#lb-caption {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--border);
  color: var(--muted2);
  padding: 7px 16px;
  border-radius: 8px;
  font-size: 12.5px;
  white-space: nowrap;
  max-width: 90vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
</style>
</head>
<body>

<!-- ── LANDING ──────────────────────────────────────────────── -->
<div id="landing">
  <p class="landing-logo">⬡ Second Brain</p>
  <h1 class="hero-title">Second Brain</h1>
  <p class="hero-sub">Your screenshots, searchable by meaning</p>

  <div class="search-hero">
    <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input id="hero-input" type="text"
           placeholder="Search your screenshots by meaning..."
           autocomplete="off" spellcheck="false" />
  </div>

  <div class="chips">
    <button class="chip" onclick="runSearch('assembly line bottleneck')">assembly line bottleneck</button>
    <button class="chip" onclick="runSearch('error message')">error message</button>
    <button class="chip" onclick="runSearch('pricing page')">pricing page</button>
  </div>
</div>

<!-- ── APP SHELL ────────────────────────────────────────────── -->
<div id="app">
  <header id="app-header">
    <div class="header-logo" onclick="goHome()">Second<em>Brain</em></div>
    <div class="search-header">
      <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="header-input" type="text"
             placeholder="Search your screenshots by meaning..."
             autocomplete="off" spellcheck="false" />
    </div>
  </header>

  <div id="results-area">
    <div class="results-meta" id="results-meta"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<!-- ── LIGHTBOX ─────────────────────────────────────────────── -->
<div id="lightbox">
  <button id="lb-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="" />
  <div id="lb-caption"></div>
</div>

<script>
  const heroInput   = document.getElementById('hero-input');
  const headerInput = document.getElementById('header-input');
  const landing     = document.getElementById('landing');
  const app         = document.getElementById('app');
  const grid        = document.getElementById('grid');
  const meta        = document.getElementById('results-meta');

  let currentHits = [];

  // ── INPUT EVENTS ──────────────────────────────────────────
  heroInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch(heroInput.value.trim());
  });

  headerInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') runSearch(headerInput.value.trim());
  });

  // ── SEARCH ────────────────────────────────────────────────
  function runSearch(query) {
    if (!query) return;

    heroInput.value   = query;
    headerInput.value = query;

    // Switch to app shell
    landing.style.display = 'none';
    app.style.display = 'flex';

    // Focus header input for follow-up searches
    setTimeout(() => headerInput.focus(), 50);

    showSkeleton();

    fetch('/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 3 }),
    })
      .then(r => r.json())
      .then(hits => render(query, hits))
      .catch(() => {
        meta.textContent = 'Search failed — is the server running?';
        grid.innerHTML = '';
      });
  }

  // ── SKELETON ──────────────────────────────────────────────
  function showSkeleton() {
    meta.textContent = 'Searching…';
    grid.innerHTML = Array(3).fill(0).map(() => `
      <div class="skeleton-card">
        <div class="sk sk-img"></div>
        <div class="sk-body">
          <div class="sk sk-line w85"></div>
          <div class="sk sk-line w60"></div>
          <div class="sk sk-line w45"></div>
        </div>
      </div>`).join('');
  }

  // ── RENDER RESULTS ────────────────────────────────────────
  function render(query, hits) {
    currentHits = hits;

    if (!hits.length) {
      meta.textContent = `No results for "${query}"`;
      grid.innerHTML = `
        <div class="no-results">
          <h3>No screenshots found</h3>
          <p>Try broader terms — the search matches by meaning, not exact words</p>
        </div>`;
      return;
    }

    const count = hits.length;
    meta.textContent = `${count} result${count !== 1 ? 's' : ''} for "${query}"`;

    grid.innerHTML = hits.map((hit, i) => {
      const pct = Math.round(hit.score * 100);
      const badgeClass = pct >= 80 ? 'badge-green' : pct >= 50 ? 'badge-yellow' : 'badge-red';
      const imgSrc = `/image?path=${encodeURIComponent(hit.path)}`;
      const preview = (hit.text || '').replace(/\s+/g, ' ').trim().slice(0, 200);

      return `
        <div class="card" data-index="${i}">
          <div class="card-img-wrap">
            <img class="card-thumb"
                 src="${imgSrc}"
                 alt="${escHtml(hit.filename)}"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="card-no-thumb" style="display:none">
              <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="m3 16 5-5 4 4 3-3 4 4"/><circle cx="8.5" cy="8.5" r="1.5"/>
              </svg>
            </div>
            <span class="badge ${badgeClass}">${pct}%</span>
          </div>
          <div class="card-body">
            <div class="card-filename">${escHtml(hit.filename)}</div>
            <div class="card-preview">${escHtml(preview)}</div>
          </div>
        </div>`;
    }).join('');
  }

  // ── CARD CLICKS (delegation) ──────────────────────────────
  grid.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const hit = currentHits[parseInt(card.dataset.index)];
    if (!hit) return;
    openLightbox(`/image?path=${encodeURIComponent(hit.path)}`, hit.filename);
  });

  // ── LIGHTBOX ──────────────────────────────────────────────
  function openLightbox(src, caption) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lb-caption').textContent = caption;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.getElementById('lightbox-img').src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeLightbox();
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });

  // ── HOME ──────────────────────────────────────────────────
  function goHome() {
    app.style.display = 'none';
    landing.style.display = 'flex';
    heroInput.value = '';
    headerInput.value = '';
    grid.innerHTML = '';
    heroInput.focus();
  }

  // ── UTIL ──────────────────────────────────────────────────
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Auto-focus on load
  heroInput.focus();
</script>
</body>
</html>
